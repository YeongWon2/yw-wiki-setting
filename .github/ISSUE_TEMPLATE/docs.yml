name: 문서
description: 문서가 틀렸거나 읽기 어려울 때
labels: ["type: docs", "status: needs-triage"]
body:
  - type: input
    id: where
    attributes:
      label: 어느 문서 어느 부분
      placeholder: README.md › 설치
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무엇이 문제인가
      description: 틀린 내용, 빠진 내용, 이해하기 어려운 문장
    validations:
      required: true
