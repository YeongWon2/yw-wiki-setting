# 찾기: 위키에 적힌 것으로 근거 링크와 함께 답한다.
title = "찾기"

[[step]]
id = "start"
do = "최신 확인과 원격 받기."
gates = ["run?:{bin} version", "pull"]

[[step]]
id = "entry"
do = """wiki/index.md에서 입구를 고른다: 질문의 entity · `<분야> 지도` synthesis.
'어떻게 하지 · 무엇을 지키지'는 Guides 구획, '나는 보통 어떻게 해'는 `내 방식 지도`, 날짜 질문은 raw/daily/와 그날 source. note에 입구 페이지."""
gates = ["note"]

[[step]]
id = "read"
do = """Connections를 따라 필요한 페이지만 연다. superseded 결정은 superseded_by를 따라간다.
review/는 근거로 쓰지 않는다(pending이면 '검토 중인 내용 있음'만). note에 근거 페이지 목록."""
gates = ["note"]

[[step]]
id = "answer"
do = """첫 줄 결론 → 근거 [[페이지]]와 원본 링크. 추정(confidence low · [low confidence])은 밝히고,
guide는 maturity · owner_checked를 함께, 지금 작업에 적용할 Rules + Exceptions로. 위키에 없으면 '위키에 없음'. 틀린 페이지는 고치지 말고 알린다."""
gates = ["note"]

[[step]]
id = "save"
optional = true
do = "여러 페이지를 묶은 답이고 다시 물을 만하면 wiki/synthesis/에 저장(related에 묶은 페이지) → index → `yw-wiki log query \"<질문 요약>\"`. 한 번 묻고 끝날 답이면 skip."
gates = ["changed:wiki/synthesis/", "run:{bin} index", "log:query", "check"]

[[step]]
id = "push"
do = "저장했으면 커밋하고 push한다. 저장 안 했으면 바뀐 것이 없어 그대로 통과한다."
gates = ["pushed"]
