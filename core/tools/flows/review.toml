# 검토: review/의 대기 항목을 보여 주고 사람이 정한 것만 위키에 반영한다.
title = "검토"

[[step]]
id = "start"
do = "최신 확인과 원격 받기."
gates = ["run?:{bin} version", "pull"]

[[step]]
id = "show"
do = """review/*.md 중 status: pending을 오래된 순으로 읽고 대상 페이지 · 근거 원본도 연다(바뀌었으면 최신으로 맞춤).
'guide 확인하자'면 owner_checked: false guide를 maturity 높은 순으로 Rules만.
첫 줄 '검토할 것 N개' → 번호 목록(무엇을 정하나 · 지금 위키 · 새 원본 · 근거와 날짜 · 선택지). note에 N."""
gates = ["note"]

[[step]]
id = "decide"
do = "사용자가 정한 번호만 처리한다(정함 · 보류 · 버림). 사용자 말 원문을 항목 ## Decision에 적는다. note에 원문."
gates = ["note"]

[[step]]
id = "apply"
optional = true
do = """정한 내용을 템플릿 형식으로 위키에 쓴다(Key facts · Timeline, 새 decision accepted + 이전 superseded, 나누기 · 합치기 · archived).
guide 병합 초안(duplicate · conflict)을 정했으면 초안대로 합치고 없앤 쪽은 superseded, `yw-wiki log merge`.
guide '맞다' → owner_checked: true · owner_checked_on · `yw-wiki log confirm \"<페이지>\" \"<원문>\"`. 정함이 없으면 skip."""
gates = ["changed:wiki/"]

[[step]]
id = "cleanup"
do = "반영한 항목과 버린 항목의 review 파일을 지운다. 보류는 그대로 둔다."
gates = ["note"]

[[step]]
id = "index-log"
do = "`yw-wiki log review \"<요약>\" \"정함 N\" \"보류 M\" \"버림 K\"`"
gates = ["run:{bin} index", "log:review"]

[[step]]
id = "check"
do = "점검 오류 0까지 고친다."
gates = ["check"]

[[step]]
id = "push"
do = "커밋하고 push한다."
gates = ["pushed"]

[[step]]
id = "report"
do = "보고 첫 줄: 정함 N · 보류 M · 버림 K, 남은 검토 R."
gates = ["note"]
