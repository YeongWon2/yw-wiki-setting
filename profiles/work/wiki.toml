# 업무 위키 설정. 위키가 소유한다(upgrade.py가 건드리지 않음). 비밀번호 · 토큰 · 이메일은 넣지 않는다.
# 세팅 프로젝트에는 회사 값을 두지 않는다. new_wiki.py로 만든 뒤 위키에서 채운다.

[wiki]
id = "work"
name = "개인 업무 위키"
aliases = ["업무 위키", "회사 위키 초안", "work"]
description = "<회사> 업무 기록, 결정, 전사 위키 승격 초안"
profile = "work"
language = "ko"

[entities]
kinds = ["people", "orgs", "projects"]

[folders]
wiki = ["drafts"]
raw = ["meetings", "worklog", "collected", "assets"]

[company]
name = "<회사>"

[company.sources]               # 이 출처에서 나온 자료는 이 회사 것이다
jira = "<사이트>.atlassian.net"
slack = "<워크스페이스>.slack.com"
notion = "<노션 시작 페이지>"
github = ["<조직>"]

[company.company_wiki]          # 전사 위키. 이 위키 안에 넣지 않고 옆 폴더에 클론한다
repo = "<조직>/<전사 위키 저장소>"
path = "~/Desktop/wiki/<전사 위키 폴더>"

# 프로젝트별 수집 경로. 키 = 프로젝트 entity 이름
# jira: 이슈 키 · "epic:<키>" · JQL / slack: 채널 · 스레드 링크 / notion: 페이지 링크 / github: 저장소
# [company.projects."<프로젝트>"]
# jira = []
# github = []

[career]                        # 경력 추출을 받을 개인 위키
personal_wiki = "personal"      # vaults.toml의 id
